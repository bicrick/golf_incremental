<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<meta name="theme-color" content="#000000">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #f5f0dc;
	background-color: #000;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	background-color: #000;
	visibility: visible;
	z-index: 2;
}

#status.fade-chrome {
	background-color: transparent;
	transition: background-color 0.5s ease;
}

#status.fade-chrome #status-progress {
	opacity: 0;
	transition: opacity 0.5s ease;
}

#status-splash {
	position: absolute;
	display: block;
	margin: 0;
	image-rendering: pixelated;
	image-rendering: crisp-edges;
	pointer-events: none;
}

#status-splash.is-hidden {
	visibility: hidden;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	position: absolute;
	height: 8px;
	margin: 0;
	border: 1px solid #c4a02a;
	background: #1a1404;
	accent-color: #e6c63d;
	-webkit-appearance: none;
	appearance: none;
}

#status-progress::-webkit-progress-bar {
	background: #1a1404;
}

#status-progress::-webkit-progress-value {
	background: #e6c63d;
}

#status-progress::-moz-progress-bar {
	background: #e6c63d;
}

#status-notice {
	position: absolute;
	left: 50%;
	top: 62%;
	transform: translate(-50%, 0);
	background-color: #111;
	border-radius: 0;
	border: 2px solid #444;
	color: #f5f0dc;
	font-family: "Courier New", ui-monospace, SFMono-Regular, Menlo, monospace;
	line-height: 1.3;
	margin: 0 2rem;
	max-width: 28rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="Range Rat">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
(function () {
	if (window.__golfAudioUnlockInstalled) {
		return;
	}
	var Orig = window.AudioContext || window.webkitAudioContext;
	window.__golfResumeAudio = function () {
		var ctx = window.__golfAudioCtx;
		if (ctx && ctx.state !== "running" && ctx.resume) {
			ctx.resume();
		}
	};
	["pointerdown", "touchstart", "keydown", "mousedown"].forEach(function (type) {
		window.addEventListener(type, window.__golfResumeAudio, { capture: true, passive: true });
	});
	if (Orig) {
		try {
			class GolfAudioContext extends Orig {
				constructor(opts) {
					super(opts);
					window.__golfAudioCtx = this;
				}
			}
			window.AudioContext = GolfAudioContext;
			if (window.webkitAudioContext) {
				window.webkitAudioContext = GolfAudioContext;
			}
			window.__golfAudioUnlockInstalled = true;
		} catch (err) {}
	}
})();
		</script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusSplash = document.getElementById('status-splash');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const LOGO_W = 420;
	const LOGO_H = 132;
	const VBOX_SEP = 12;
	const PROMPT_H = 8;
	const CHROME_FADE_MS = 500;

	let initializing = true;
	let statusMode = '';
	let loaderFading = false;

	function layoutLoader() {
		const w = window.innerWidth;
		const h = window.innerHeight;
		const portrait = h > w;
		const baseW = portrait ? 270 : 480;
		const baseH = portrait ? 480 : 270;
		const scale = Math.min(w / baseW, h / baseH);
		const safeScale = scale > 0 ? scale : 1;
		const viewW = w / safeScale;
		const viewH = h / safeScale;
		const maxW = Math.min(LOGO_W, Math.floor(viewW * 0.9));
		const logoScale = maxW / LOGO_W;
		const logoW = LOGO_W * logoScale;
		const logoH = LOGO_H * logoScale;
		const vboxH = logoH + VBOX_SEP + PROMPT_H;
		const left = (viewW - logoW) / 2 * safeScale;
		const top = (viewH - vboxH) / 2 * safeScale;
		statusSplash.style.width = (logoW * safeScale) + 'px';
		statusSplash.style.height = (logoH * safeScale) + 'px';
		statusSplash.style.left = left + 'px';
		statusSplash.style.top = top + 'px';
		const barW = Math.min(160, logoW) * safeScale;
		statusProgress.style.width = barW + 'px';
		statusProgress.style.left = ((viewW * safeScale) - barW) / 2 + 'px';
		statusProgress.style.top = (top + logoH * safeScale + VBOX_SEP * safeScale) + 'px';
		statusProgress.style.height = Math.max(6, 8 * Math.min(safeScale, 2)) + 'px';
	}

	function fadeLoaderChrome() {
		if (loaderFading) {
			return;
		}
		loaderFading = true;
		initializing = false;
		statusSplash.classList.add('is-hidden');
		statusOverlay.classList.add('fade-chrome');
		window.setTimeout(function () {
			if (statusOverlay.parentNode) {
				statusOverlay.remove();
			}
		}, CHROME_FADE_MS + 80);
	}

	window.__rangeRatTitleReady = function () {
		window.__rangeRatTitleIsReady = true;
		fadeLoaderChrome();
	};

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			if (window.__rangeRatTitleIsReady) {
				fadeLoaderChrome();
			}
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
		layoutLoader();
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	window.addEventListener('resize', layoutLoader);
	layoutLoader();

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Range Rat on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			window.setTimeout(function () {
				if (!loaderFading) {
					fadeLoaderChrome();
				}
			}, 2000);
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
